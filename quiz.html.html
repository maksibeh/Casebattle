<!doctype html>
<html lang="ru">
<head>

<title>QuizBattleCS</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#050505;--card:#111113;--line:#FF8A1F;--dim:#2C2C30;--text:#F5F5F5;--mute:#9A9AA2;--acc:#FF8A1F;--ok:#4ADE80;--okbg:#0F2A1B;--bad:#FF6B6B;--badbg:#2E1416;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:500 16px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:20px 16px 32px}
h1,h2,.big{font-family:Unbounded,Manrope,system-ui,sans-serif;font-weight:600;line-height:1.2;margin:0}
h1{font-size:24px;margin:8px 0 20px}
.logo{display:flex;align-items:center;gap:10px;margin:4px 0 22px;font-family:Unbounded,Manrope,system-ui,sans-serif;font-weight:600;font-size:22px;letter-spacing:.5px}
.logo b{color:var(--acc);font-weight:600}
h2{font-size:19px;margin:22px 0 18px;white-space:pre-line}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.inp:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.test{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:18px;border:2px solid var(--line);background:var(--card);border-radius:14px;margin-bottom:12px;text-align:left}
.test b{font-family:Unbounded,Manrope,sans-serif;font-size:17px}
.test span{color:var(--mute);font-size:14px;white-space:nowrap}
.top{display:flex;align-items:center;gap:12px}
.back{border:0;background:var(--card);width:40px;height:40px;border-radius:10px;font-size:20px;flex:none}
.slots{display:flex;gap:3px;flex:1}
.slots i{flex:1;height:8px;border-radius:4px;background:var(--dim)}
.slots i.cur{background:var(--acc)}
.slots i.ok{background:var(--ok)}
.slots i.bad{background:var(--bad)}
.hint{color:var(--mute);margin:-8px 0 14px;font-size:14px}
.opts{display:grid;gap:10px}
.opt{position:relative;width:100%;text-align:left;padding:15px 16px;border:2px solid var(--line);background:var(--card);border-radius:12px;transition:background .15s,border-color .15s}
.opt.sel{background:#2A1A08}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.inp{width:100%;padding:15px 16px;border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;font:inherit}
#fb{margin-top:12px}
.opt.hit{animation:shake .55s ease-in-out,glowok .9s ease-out forwards}
.opt.bad{animation:glowbad 1.1s ease-out forwards}
.rays{position:absolute;inset:0;pointer-events:none}
.rays i{position:absolute;width:3px;height:12px;margin:-6px 0 0 -1.5px;border-radius:2px;background:var(--ok);box-shadow:0 0 8px var(--ok);opacity:0;animation:ray .7s ease-out .05s forwards}
@keyframes shake{0%,100%{transform:translateX(0)}12%{transform:translateX(-7px)}28%{transform:translateX(7px)}44%{transform:translateX(-6px)}60%{transform:translateX(6px)}76%{transform:translateX(-3px)}90%{transform:translateX(3px)}}
@keyframes glowok{0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}100%{box-shadow:0 0 18px 2px rgba(74,222,128,.45)}}
@keyframes glowbad{0%{box-shadow:0 0 0 0 rgba(255,107,107,0)}40%{box-shadow:0 0 26px 6px rgba(255,107,107,.85)}100%{box-shadow:0 0 16px 2px rgba(255,107,107,.55)}}
@keyframes ray{0%{opacity:1;transform:rotate(var(--a)) translateY(-2px)}100%{opacity:0;transform:rotate(var(--a)) translateY(-30px)}}
.next,.btn{display:block;width:100%;margin-top:18px;padding:15px;border:0;border-radius:12px;background:var(--acc);color:#0A0A0A;font-weight:700}
.btn.alt{background:var(--card);color:var(--text);border:2px solid var(--line)}
.big{font-size:56px;margin:18px 0 4px}
.verdict{color:var(--mute);margin:0 0 20px}
.miss{background:var(--card);border:2px solid var(--dim);border-radius:12px;padding:14px;margin-bottom:10px}
.miss p{margin:0 0 6px}
.miss .r{color:var(--ok)}
.miss .w{color:var(--bad)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.prof{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:700;margin-top:4px}
.who{color:var(--mute);margin:14px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-family:Unbounded,Manrope,sans-serif;font-size:26px;color:var(--acc)}
.stat span{color:var(--mute);font-size:13px}
.sub{font-size:16px;margin:8px 0 10px}
.row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;background:var(--card);border:2px solid var(--dim);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row small{width:100%;color:var(--mute)}
.coins{display:flex;align-items:center;gap:7px;border:2px solid var(--line);background:var(--card);border-radius:20px;padding:5px 14px 5px 8px;font-weight:700;margin-top:6px}
.coins img{width:24px;height:24px;display:block}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.bar{pointer-events:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;width:100%;max-width:400px;background:rgba(20,20,26,.94);border:1px solid #2E2E38;border-radius:26px;padding:8px 12px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.65)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:#8C8C99;font-size:12px;font-weight:700;padding:8px 0;border-radius:16px}
.tab.on{color:#fff;background:rgba(255,255,255,.12)}
.tab.main{flex:0 0 100px;height:70px;margin-top:-28px;justify-content:center;color:#0A0A0A;font-size:13px;background:linear-gradient(180deg,#FFFFFF,#E4E4EA);box-shadow:0 6px 20px rgba(255,255,255,.22);border-radius:22px}
.tab.main svg{width:28px;height:28px}
.tab.main.on{box-shadow:0 0 0 3px #050505,0 6px 26px rgba(255,255,255,.5)}
.test:disabled{opacity:.55;cursor:default;border-color:var(--dim)}
.chips{display:flex;gap:8px;margin:-6px 0 16px;flex-wrap:wrap}
.chip{border:2px solid var(--dim);border-radius:18px;padding:6px 12px;font-size:14px;color:var(--mute)}
.chip.on{border-color:var(--line);color:var(--text)}
.task{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:2px solid var(--dim);border-radius:12px;padding:14px;margin-bottom:10px}
.tt b{display:block}
.tt span{color:var(--mute);font-size:14px}
.claim{border:2px solid var(--line);background:var(--acc);color:#0A0A0A;font-weight:700;border-radius:10px;padding:8px 12px;white-space:nowrap}
.claim.off,.claim.got{background:transparent;color:var(--mute);border-color:var(--dim)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.opt.hit{animation:none;box-shadow:0 0 18px 2px rgba(74,222,128,.45)}.opt.bad{animation:none;box-shadow:0 0 16px 2px rgba(255,107,107,.55)}.rays{display:none}}
</style>
</head>

    { q: 'Выберите верные утверждения про установку коэффициента в быстром подборе:', o: ['Коэффициент должен быть от 1 до 99', 'Коэффициент может быть дробным', 'Коэффициент может быть больше 75', 'Ни одно из утверждений не подходит'], a: [2] },
    { q: 'Самый дорогой кейс в разделе «Имидж-кейсы»?', o: ['Нашивки команд', 'Агенты', 'Наклейки XL-box', 'Пины'], a: 1 },
    { q: 'Выберите верное описание к утверждениям:\nа) Кейсов в разделе «Операции» 10\nб) Кейсов «Операции» больше, чем хэллоуинских кейсов', o: ['Верно а', 'Верно б', 'Верно и а, и б', 'Ни одно не правильно'], a: 3 },
    { q: 'Цена кейса «Оружейный кейс 1»?', o: ['199 рублей', '1499 рублей', '3499 рублей', '69 рублей'], a: 2 },
    { q: 'Кейс за 750 баттлкоинов?', t: 'text', a: 'Турмалиновый' },

    { q: 'Стоимость кейса «Бладхаунд»?', t: 'text', a: '549' },
    { q: 'Сколько предметов в кейсе Bitcoin?', t: 'text', a: '36' },

const app = document.getElementById('app');
const LOGO = '<div class="logo"><svg width="36" height="36" viewBox="0 0 34 34" fill="none" aria-hidden="true"><rect x="3" y="12" width="28" height="18" rx="3" stroke="#FF8A1F" stroke-width="2.5"/><path d="M3 17h28" stroke="#FF8A1F" stroke-width="2.5"/><rect x="14" y="15" width="6" height="5" rx="1" fill="#FF8A1F"/><path d="M6 12l3-7h16l3 7" stroke="#FF8A1F" stroke-width="2.5" stroke-linejoin="round"/></svg><span>QUIZ<b>BATTLE</b>CS</span></div>';
const RAYS = '<span class="rays" aria-hidden="true">' + [[12,0,0],[37,0,0],[63,0,0],[88,0,0],[12,100,180],[37,100,180],[63,100,180],[88,100,180],[0,30,-90],[0,70,-90],[100,30,90],[100,70,90]].map(([x, y, a]) => `<i style="left:${x}%;top:${y}%;--a:${a}deg"></i>`).join('') + '</span>';
let test, i, answers, testIdx;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9]/g, '');
const pin = t => /^(Ни |Нету )/.test(t);

function shuffle(arr) {
  const a = arr.slice();
  for (let n = a.length - 1; n > 0; n--) {
    const m = Math.floor(Math.random() * (n + 1));
    [a[n], a[m]] = [a[m], a[n]];
  }
  return a;
}

/* Перемешивает варианты; «Ни одно…» и «Нету…» остаются в конце */
function prep(q) {
  if (q.t === 'text') return q;
  const ix = q.o.map((_, n) => n);
  const ord = shuffle(ix.filter(n => !pin(q.o[n]))).concat(ix.filter(n => pin(q.o[n])));
  const m = n => ord.indexOf(n);
  return { q: q.q, o: ord.map(n => q.o[n]), a: Array.isArray(q.a) ? q.a.map(m) : m(q.a) };
}

function check(q, x) {
  if (q.t === 'text') {
    const e = String(q.a);
    return /^\d+$/.test(e) ? String(x).replace(/\D/g, '') === e : norm(x) === norm(e);
  }
  if (Array.isArray(q.a)) return x.length === q.a.length && q.a.every(n => x.includes(n));
  return x === q.a;
}

function fmt(q, a) {
  if (q.t === 'text') return a || '—';
  if (Array.isArray(a)) return a.length ? a.map(n => q.o[n]).join(', ') : '—';
  return q.o[a];
}

/* ===== СТАТИСТИКА: Telegram CloudStorage (синхронизация между устройствами) + localStorage ===== */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#050505'); tg.setBackgroundColor('#050505'); } catch (e) {} }
const SKEY = 'qbcs_stats';
const cloud = () => !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'));
const blank = () => ({ tests: {}, coins: 10, daily: null });
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
function fix(s) {
  if (typeof s.coins !== 'number') s.coins = 10;
  if (!s.daily || s.daily.d !== todayKey()) s.daily = { d: todayKey(), p: { correct: 0, tests: 0, duels: 0, wins: 0 }, c: {} };
  return s;
}
const valid = s => (s && s.tests ? s : null);
function localGet() { try { return valid(JSON.parse(localStorage.getItem(SKEY))); } catch (e) { return null; } }
function loadStats(cb) {
  if (cloud()) {
    tg.CloudStorage.getItem(SKEY, (err, v) => {
      let s = null;
      if (!err && v) { try { s = valid(JSON.parse(v)); } catch (e) {} }
      cb(fix(s || localGet() || blank()));
    });
  } else cb(fix(localGet() || blank()));
}
function saveStats(s) {
  const j = JSON.stringify(s);
  try { localStorage.setItem(SKEY, j); } catch (e) {}
  if (cloud()) tg.CloudStorage.setItem(SKEY, j, () => {});
}
function record(score, total, cb) {
  loadStats(s => {
    const e = s.tests[test.title] || (s.tests[test.title] = { n: 0, c: 0, t: 0, b: 0, h: [] });
    e.n++; e.c += score; e.t += total;
    e.b = Math.max(e.b, Math.round(score / total * 100));
    e.h.push([Date.now(), score, total]);
    if (e.h.length > 40) e.h = e.h.slice(-40);
    const gain = score + (score === total ? 10 : 0);
    s.coins += gain; s.daily.p.correct += score; s.daily.p.tests += 1;
    saveStats(s);
    if (cb) cb(e.n, gain);
  });
}

function profile() {
  app.innerHTML = LOGO + '<p class="verdict">Загрузка…</p>';
  loadStats(s => {
    const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
    const name = u ? [u.first_name, u.last_name].filter(Boolean).join(' ') : 'Игрок';
    const es = Object.keys(s.tests).map(k => ({ k, e: s.tests[k] }));
    const sum = f => es.reduce((a, x) => a + f(x.e), 0);
    const n = sum(e => e.n), c = sum(e => e.c), t = sum(e => e.t);
    const best = es.reduce((a, x) => Math.max(a, x.e.b), 0);
    const pct = t ? Math.round(c / t * 100) : 0;
    const when = ts => new Date(ts).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    app.innerHTML = headHtml(s) + `<h1>Профиль</h1>
      <p class="who">${esc(name)} · ID ${uid}</p>
      <div class="grid">
        <div class="stat"><b>${n}</b><span>попыток</span></div>
        <div class="stat"><b>${c}</b><span>верных ответов</span></div>
        <div class="stat"><b>${pct}%</b><span>общая точность</span></div>
        <div class="stat"><b>${best}%</b><span>лучший результат</span></div>
      </div>
      ${es.length ? es.map(({ k, e }) => `<h2 class="sub">${esc(k)}: история попыток</h2>` + e.h.slice().reverse().slice(0, 20).map((a, idx) =>
        `<div class="row"><span>Попытка №${e.n - idx}</span><span>${a[1]} из ${a[2]} · ${Math.round(a[1] / a[2] * 100)}%</span><small>${when(a[0])}</small></div>`).join('')).join('') : '<p class="verdict">Пока нет попыток. Пройди тест, и результаты появятся здесь.</p>'}
      ${n ? '<button class="btn alt" id="rs">Сбросить статистику</button>' : ''}` + navHtml('p');
    wireNav();
    const rs = document.getElementById('rs');
    if (rs) rs.onclick = () => {
      if (rs.dataset.s) { loadStats(s2 => { s2.tests = {}; saveStats(s2); profile(); }); }
      else { rs.dataset.s = '1'; rs.textContent = 'Нажми ещё раз, чтобы удалить всё'; }
    };
  });
}

/* ===== ДУЭЛИ 1 НА 1 (Firebase Realtime Database) ===== */
const DB_URL = 'https://quizbattlecs-default-rtdb.europe-west1.firebasedatabase.app/';
const dbOk = () => /^https:\/\//.test(DB_URL);
const db = (path, method, body) => fetch(DB_URL.replace(/\/$/, '') + '/' + path + '.json', {
  method: method || 'GET', headers: { 'Content-Type': 'application/json' },
  body: body === undefined ? undefined : JSON.stringify(body)
}).then(r => { if (!r.ok) throw new Error('db'); return r.json(); });
function getUid() {
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u) return String(u.id);
  try {
    let v = localStorage.getItem('qb_uid');
    if (!v) { v = String(Math.floor(1e6 + Math.random() * 9e6)); localStorage.setItem('qb_uid', v); }
    return v;
  } catch (e) { return String(Math.floor(1e6 + Math.random() * 9e6)); }
}
const uid = getUid();
const myName = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || 'Игрок';
let duel = null, watchT = null;

function stopWatch() { if (watchT) { clearInterval(watchT); watchT = null; } }
function watch(path, fn) {
  stopWatch();
  const tick = () => db(path).then(v => { if (watchT && fn(v)) stopWatch(); }).catch(() => {});
  watchT = setInterval(tick, 1200); tick();
}
const head2 = t => `<div class="top"><button class="back" id="x" aria-label="Назад">←</button><h2 style="margin:0">${t}</h2></div>`;

function duelMenu() {
  stopWatch(); duel = null;
  if (!dbOk()) {

  }
  app.innerHTML = head2('Дуэль 1 на 1') + `<p class="who">Твой ID: <b>${uid}</b></p>

  app.querySelectorAll('.cr').forEach(b => b.onclick = () => duelCreate(+b.dataset.n));

function duelCreate(n) {
  const qs = shuffle(TESTS[0].questions.map((_, k) => k)).slice(0, n);
  const room = { host: { id: uid, name: myName }, n, qs, status: 'wait', ts: Date.now() };
  app.innerHTML = head2('Комната создана') + `<p class="verdict" style="margin-top:20px">Отправь другу свой ID: <b>${uid}</b><br>Ждём соперника…</p>`;
  document.getElementById('x').onclick = () => { stopWatch(); db('rooms/' + uid, 'DELETE').catch(() => {}); duelMenu(); };
  db('rooms/' + uid, 'PUT', room)
    .then(() => watch('rooms/' + uid, v => { if (v && v.guest) { duelStart(v); return true; } return false; }))
    .catch(() => { app.innerHTML = head2('Нет связи') + '<p class="verdict" style="margin-top:20px">Не удалось подключиться к базе. Проверь интернет.</p>'; document.getElementById('x').onclick = duelMenu; });
}

function duelJoin(hid) {
  const msg = document.getElementById('msg');
  if (!hid) { msg.textContent = 'Введи ID друга'; return; }
  if (hid === uid) { msg.textContent = 'Это твой собственный ID'; return; }
  msg.textContent = 'Ищем комнату…';
  db('rooms/' + hid).then(r => {
    if (!r || r.status !== 'wait' || r.guest || Date.now() - r.ts > 3600000) { msg.textContent = 'Комната не найдена или уже занята'; return; }
    const g = { id: uid, name: myName };
    return db('rooms/' + hid, 'PATCH', { guest: g, status: 'play' }).then(() => { r.guest = g; duelStart(r); });
  }).catch(() => { msg.textContent = 'Нет связи с базой'; });
}

function duelStart(room) {
  stopWatch();
  const host = room.host.id === uid;
  duel = { host: room.host.id, opp: host ? room.guest : room.host, t0: Date.now() };
  const base = TESTS[0].questions;
  test = { title: 'Дуэль', questions: Object.values(room.qs).map(k => prep(base[k])) };
  i = 0; answers = []; ask();
}

function duelEnd() {
  const qs = test.questions, s = qs.filter((q, n) => check(q, answers[n])).length, t = Date.now() - duel.t0;
  duel.me = { s, t };
  app.innerHTML = head2('Готово') + '<p class="verdict" style="margin-top:20px">Ждём, пока соперник закончит…</p>';
  document.getElementById('x').onclick = home;
  db('rooms/' + duel.host + '/res/' + uid, 'PUT', { s, t }).catch(() => {});
  watch('rooms/' + duel.host, r => {
    const o = r && r.res && r.res[duel.opp.id];
    if (!o) return false;
    duelResult(o); return true;
  });
}

function duelResult(o) {
  const me = duel.me, sec = ms => (ms / 1000).toFixed(1) + ' с';
  const win = me.s !== o.s ? me.s > o.s : (me.t !== o.t ? me.t < o.t : null);
  const byTime = me.s === o.s && win !== null;
  app.innerHTML = LOGO + `<div class="big" style="font-size:36px">${win === null ? 'Ничья' : win ? 'Победа!' : 'Поражение'}</div>
    <p class="verdict">${byTime ? 'Счёт равный, победитель определён по времени' : ''}<br><span id="dc"></span></p>
    <div class="grid"><div class="stat"><b>${me.s}</b><span>ты · ${sec(me.t)}</span></div><div class="stat"><b>${o.s}</b><span>${esc(duel.opp.name)} · ${sec(o.t)}</span></div></div>
    <button class="btn" id="again">В меню дуэлей</button><button class="btn alt" id="all">На главную</button>`;
  document.getElementById('again').onclick = duelMenu;
  if (!duel.paid) {
    duel.paid = true;
    payDuel(win, me.s, d => { const el = document.getElementById('dc'); if (el) el.textContent = (d >= 0 ? '+' : '') + d + ' монет'; });
  }
  document.getElementById('all').onclick = home;
}

function payDuel(win, correct, cb) {
  loadStats(s => {
    const raw = win === null ? 2 : win ? 5 : -3, before = s.coins;
    s.coins = Math.max(0, s.coins + raw);
    s.daily.p.duels += 1; if (win) s.daily.p.wins += 1; s.daily.p.correct += correct;
    saveStats(s); cb(s.coins - before);
  });
}

const headHtml = s => `<div class="head">${LOGO}<div class="coins"><img src="${COIN}" alt="">${s.coins}</div></div>`;
const ic = d => '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
const ICONS = {
  q: ic('<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 12l2 2 4-4"/>'),
  h: ic('<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7"/><path d="M12 17h.01"/>'),
  p: ic('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/>')
};
function navHtml(on) {
  const t = (id, label, cls) => `<button class="tab${cls || ''}${on === id ? ' on' : ''}" data-t="${id}">${ICONS[id]}<span>${label}</span></button>`;
  return `<nav class="tabs"><div class="bar">${t('q', 'Задания')}${t('h', 'Тесты', ' main')}${t('p', 'Профиль')}</div></nav><div style="height:110px"></div>`;
}
function wireNav() {
  app.querySelectorAll('.tab').forEach(b => b.onclick = () => { const t = b.dataset.t; if (t === 'p') profile(); else if (t === 'q') tasks(); else home(); });
}
const TASKS = [
  { id: 'c10', t: 'Ответь верно на 10 вопросов', k: 'correct', n: 10, r: 5 },
  { id: 't1', t: 'Пройди тест до конца', k: 'tests', n: 1, r: 3 },
  { id: 'd1', t: 'Сыграй дуэль', k: 'duels', n: 1, r: 5 },
  { id: 'w1', t: 'Выиграй дуэль', k: 'wins', n: 1, r: 10 }
];
function tasks() {
  stopWatch(); duel = null;
  loadStats(s => {
    const p = s.daily.p;
    app.innerHTML = headHtml(s) + '<h1>Задания</h1><div class="chips"><span class="chip on">На сегодня</span><span class="chip">Недельные — скоро</span></div>' + TASKS.map(x => {
      const v = Math.min(p[x.k], x.n), done = v >= x.n, got = !!s.daily.c[x.id];
      const btn = got ? '<button class="claim got" disabled>Получено</button>' : done ? `<button class="claim" data-id="${x.id}">Забрать</button>` : '<button class="claim off" disabled>В процессе</button>';
      return `<div class="task"><div class="tt"><b>${x.t}</b><span>${v} / ${x.n} · +${x.r} монет</span></div>${btn}</div>`;
    }).join('') + '<p class="hint">Задания обновляются каждый день</p>' + navHtml('q');
    app.querySelectorAll('.claim[data-id]').forEach(b => b.onclick = () => {
      const x = TASKS.find(t => t.id === b.dataset.id);
      loadStats(s2 => {
        if (!s2.daily.c[x.id] && s2.daily.p[x.k] >= x.n) { s2.daily.c[x.id] = 1; s2.coins += x.r; saveStats(s2); }
        tasks();
      });
    });
    wireNav();
  });
}

function home() {
  duel = null; stopWatch();
  loadStats(s => drawHome(s));
}
function drawHome(s) {
  app.innerHTML = headHtml(s) + '<h1>Тесты</h1>' + TESTS.map((t, k) =>
    `<button class="test" data-k="${k}"><b>${esc(t.title)}</b><span>${t.questions.length} вопросов</span></button>`).join('') + '<h1 style="margin-top:56px">Дуэли</h1><button class="test" id="dl"><b>Дуэль 1 на 1</b><span>с другом</span></button>' + navHtml('h');
  app.querySelectorAll('.test[data-k]').forEach(b => b.onclick = () => start(+b.dataset.k));
  document.getElementById('dl').onclick = duelMenu;
  wireNav();
}

function start(k) {
  testIdx = k;
  test = { title: TESTS[k].title, questions: shuffle(TESTS[k].questions).map(prep) };
  i = 0; answers = []; ask();
}

function slots() {
  return test.questions.map((q, n) => {
    const c = n < answers.length ? (check(q, answers[n]) ? 'ok' : 'bad') : (n === i ? 'cur' : '');
    return `<i class="${c}"></i>`;
  }).join('');
}

function ask() {
  const q = test.questions[i], last = i === test.questions.length - 1;
  const text = q.t === 'text', multi = Array.isArray(q.a);
  const body = text
    ? '<input class="inp" id="in" type="text" autocomplete="off" placeholder="Введи ответ"><div id="fb"></div>'
    : '<div class="opts">' + q.o.map((t, n) => `<button class="opt" data-n="${n}">${esc(t)}</button>`).join('') + '</div>';
  app.innerHTML = `<div class="top"><button class="back" id="x" aria-label="К списку тестов">←</button><div class="slots" id="sl">${slots()}</div></div>
    <h2>${esc(q.q)}</h2>${multi ? '<p class="hint">Можно выбрать несколько ответов</p>' : ''}${body}
    <button class="next" id="ok" ${multi || text ? '' : 'hidden'}>Ответить</button>
    <button class="next" id="nx" hidden>${last ? 'Результат' : 'Дальше'}</button>`;
  document.getElementById('x').onclick = duel ? () => { duel = null; duelMenu(); } : home;
  const ok = document.getElementById('ok'), nx = document.getElementById('nx');

  const fin = x => {
    answers.push(x);
    document.getElementById('sl').innerHTML = slots();
    ok.hidden = true; nx.hidden = false;
    nx.onclick = () => { if (last) (duel ? duelEnd() : result()); else { i++; ask(); window.scrollTo(0, 0); } };
    return check(q, x);
  };

  if (text) {
    const inp = document.getElementById('in');
    ok.onclick = () => {
      const v = inp.value.trim();
      if (!v) return;
      inp.disabled = true;
      const good = fin(v), fb = document.getElementById('fb');
      fb.innerHTML = `<div class="opt ${good ? 'ok hit' : 'bad'}">${good ? 'Верно!' : 'Неверно. Верный ответ: ' + esc(q.a)}</div>`;
      if (good) fb.firstChild.insertAdjacentHTML('beforeend', RAYS);
    };
    inp.onkeydown = e => { if (e.key === 'Enter') ok.click(); };
    return;
  }

  const opts = [...app.querySelectorAll('.opt')];
  if (multi) {
    opts.forEach(b => b.onclick = () => b.classList.toggle('sel'));
    ok.onclick = () => {
      const sel = opts.filter(o => o.classList.contains('sel')).map(o => +o.dataset.n);
      if (!sel.length) return;
      const good = fin(sel);
      opts.forEach((o, m) => {
        const c = q.a.includes(m), s = sel.includes(m);
        o.disabled = true; o.classList.remove('sel');
        if (c) o.classList.add('ok'); else if (s) o.classList.add('bad');
        if (good && c) { o.classList.add('hit'); o.insertAdjacentHTML('beforeend', RAYS); }
      });
    };
    return;
  }
  opts.forEach(b => b.onclick = () => {
    const n = +b.dataset.n, good = fin(n);
    opts.forEach((o, m) => { o.disabled = true; if (m === q.a) o.classList.add('ok'); });
    if (!good) b.classList.add('bad');
    else { b.classList.add('hit'); b.insertAdjacentHTML('beforeend', RAYS); }
  });
}

function result() {
  const qs = test.questions, good = qs.map((q, n) => check(q, answers[n]));
  const score = good.filter(Boolean).length, pct = score / qs.length;
  const verdict = pct >= 0.8 ? 'Отличный результат' : pct >= 0.5 ? 'Неплохо, можно лучше' : 'Есть куда расти';
  const misses = qs.map((q, n) => ({ q, n })).filter(({ n }) => !good[n]);
  app.innerHTML = LOGO + `<h1>${esc(test.title)}</h1>
    <div class="big">${score} из ${qs.length}</div>
    <p class="verdict">${verdict}<br><span id="att"></span></p>
    ${misses.length ? '<h2 style="font-size:16px;margin:0 0 12px">Ошибки</h2>' : ''}
    ${misses.map(({ q, n }) => `<div class="miss"><p><b>${esc(q.q)}</b></p>
      <p class="w">Твой ответ: ${esc(fmt(q, answers[n]))}</p><p class="r">Верно: ${esc(fmt(q, q.a))}</p></div>`).join('')}
    <button class="btn" id="again">Пройти заново</button>
    <button class="btn alt" id="all">К списку тестов</button>`;
  document.getElementById('again').onclick = () => start(testIdx);
  record(score, qs.length, (n, g) => { const el = document.getElementById('att'); if (el) el.textContent = 'Попытка №' + n + ' · +' + g + ' монет'; });
  document.getElementById('all').onclick = home;
  window.scrollTo(0, 0);
}

home();
</script>
</body>
</html>
